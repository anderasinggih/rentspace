<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <!-- Dark Background -->
    <rect width="1200" height="630" fill="#09090b"/>
    <!-- Subtle Gradient Glow -->
    <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#glow)"/>
    
    <!-- Central Card Frame -->
    <rect x="200" y="115" width="800" height="400" rx="16" fill="#18181b" stroke="#27272a" stroke-width="4"/>
    
    <!-- Branding Text -->
    <text x="600" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle" letter-spacing="6">INVOICE</text>
    <text x="600" y="365" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#10b981" text-anchor="middle" letter-spacing="4">RENT SPACE</text>
    <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#71717a" text-anchor="middle" letter-spacing="2">Penyewaan iPhone Purwokerto</text>
</svg>
