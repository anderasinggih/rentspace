<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <!-- Dark Background -->
    <rect width="1200" height="630" fill="#09090b"/>
    <!-- Subtle Gradient Glow -->
    <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#glow)"/>
    
    <!-- Receipt Icon Grid -->
    <g transform="translate(450, 80)" stroke="#10b981" stroke-width="4" fill="none" opacity="0.9">
        <!-- Outer Receipt Frame -->
        <path d="M50 0 h200 a10 10 0 0 1 10 10 v360 l-10 10 l-15 -10 l-15 10 l-15 -10 l-15 10 l-15 -10 l-15 10 l-15 -10 l-15 10 l-15 -10 l-15 10 l-15 -10 l-15 10 l-10 -10 v-360 a10 10 0 0 1 10 -10 z" fill="#18181b" stroke="#374151" stroke-width="6"/>
        <!-- Header Lines -->
        <line x1="80" y1="50" x2="220" y2="50" stroke="#10b981" stroke-dasharray="0" stroke-width="8"/>
        <line x1="80" y1="80" x2="160" y2="80" stroke="#6b7280" stroke-width="4"/>
        <!-- Divider -->
        <line x1="70" y1="120" x2="230" y2="120" stroke="#374151" stroke-width="2"/>
        <!-- List Items -->
        <line x1="80" y1="160" x2="200" y2="160" stroke="#6b7280" stroke-width="4"/>
        <circle cx="220" cy="160" r="4" fill="#10b981" stroke="none"/>
        
        <line x1="80" y1="200" x2="180" y2="200" stroke="#6b7280" stroke-width="4"/>
        <circle cx="220" cy="200" r="4" fill="#10b981" stroke="none"/>
        
        <line x1="80" y1="240" x2="190" y2="240" stroke="#6b7280" stroke-width="4"/>
        <circle cx="220" cy="240" r="4" fill="#10b981" stroke="none"/>
        <!-- Divider -->
        <line x1="70" y1="280" x2="230" y2="280" stroke="#374151" stroke-width="2"/>
        <!-- Total -->
        <line x1="80" y1="320" x2="130" y2="320" stroke="#10b981" stroke-width="6"/>
        <line x1="180" y1="320" x2="220" y2="320" stroke="#10b981" stroke-width="8"/>
    </g>
    
    <!-- Branding Text -->
    <text x="600" y="520" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle" letter-spacing="4">RENT SPACE PURWOKERTO</text>
    <text x="600" y="565" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#10b981" text-anchor="middle" letter-spacing="2">INVOICE PREVIEW</text>
</svg>
